plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom adds the repositories needed for Minecraft and Fabric automatically.
}

loom {
	// creates the "client" source set used below
	splitEnvironmentSourceSets()
}

sourceSets {
	// Server GameTests (./gradlew runGametest). Not part of the released jar.
	gametest {
		compileClasspath += sourceSets.main.compileClasspath
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath
		runtimeClasspath += sourceSets.main.output
	}
	// Client UI smoke test (./gradlew runUitest, needs a display). Not part of the released jar.
	uitest {
		compileClasspath += sourceSets.client.compileClasspath
		compileClasspath += sourceSets.main.output
		compileClasspath += sourceSets.client.output
		runtimeClasspath += sourceSets.client.runtimeClasspath
		runtimeClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.client.output
	}
}

loom {
	accessWidenerPath = file("src/main/resources/aicompanion.accesswidener")

	mods {
		"aicompanion" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
		"aicompanion-gametest" {
			sourceSet sourceSets.gametest
		}
		"aicompanion-uitest" {
			sourceSet sourceSets.uitest
		}
	}

	runs {
		gametest {
			server()
			name "Game Test"
			vmArg "-Dfabric-api.gametest"
			runDir "build/gametest"
			source sourceSets.gametest
		}
		uitest {
			client()
			name "UI Test"
			vmArg "-Daicompanion.uitest=true"
			runDir "build/uitest"
			source sourceSets.uitest
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
	it.options.compilerArgs += ["-Xmaxerrs", "1000"]
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}
